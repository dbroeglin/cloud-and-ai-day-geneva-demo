[project]
name = "geneva-event-companion"
version = "0.1.0"
description = "Cloud and AI Day Geneva event companion and Copilot SDK hosted agent"
requires-python = ">=3.14"
dependencies = [
    "azure-ai-agentserver-responses==2.1.0",
    "azure-ai-projects==2.7.0",
    "azure-data-tables==12.7.0",
    "azure-identity>=1.25",
    "azure-monitor-opentelemetry>=1.8",
    "azure-monitor-opentelemetry-exporter>=1.0.0b56",
    "fastapi==0.141.1",
    "github-copilot-sdk==1.0.13",
    "httpx>=0.28,<1",
    "httpx2",
    "mcp==2.2.0",
    "openai>=3,<4",
    "opentelemetry-api",
    "opentelemetry-instrumentation-asgi",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-instrumentation-httpx",
    "opentelemetry-proto",
    "opentelemetry-sdk",
    "pydantic>=2.13,<3",
    "python-dotenv>=1.1",
    "uvicorn>=0.35",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1",
    "ruff>=0.12",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src/backend", "src/agents/event-guide"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py314"
line-length = 100
exclude = [".agents", "infra"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
