name: Static Web Apps preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

jobs:
  preview:
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: azure-preview
    env:
      VITE_API_BASE_URL: ${{ vars.PREVIEW_API_BASE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: src/frontend
      - run: npm run build
        working-directory: src/frontend
      - name: Check preview deployment token
        id: preview-token
        env:
          AZURE_STATIC_WEB_APPS_API_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          if [[ -n "$AZURE_STATIC_WEB_APPS_API_TOKEN" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Report skipped preview deployment
        if: steps.preview-token.outputs.available == 'false'
        run: >-
          echo "::warning::Preview deployment skipped because
          AZURE_STATIC_WEB_APPS_API_TOKEN is unavailable."
      - name: Deploy preview
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: src/frontend
          output_location: dist
          skip_app_build: true
          skip_deploy_on_missing_secrets: true

  close:
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: azure-preview
    steps:
      - name: Check preview cleanup token
        id: cleanup-token
        env:
          AZURE_STATIC_WEB_APPS_API_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          if [[ -n "$AZURE_STATIC_WEB_APPS_API_TOKEN" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Report skipped preview cleanup
        if: steps.cleanup-token.outputs.available == 'false'
        run: >-
          echo "::warning::Preview cleanup skipped because
          AZURE_STATIC_WEB_APPS_API_TOKEN is unavailable."
      - name: Close preview
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
          skip_deploy_on_missing_secrets: true
